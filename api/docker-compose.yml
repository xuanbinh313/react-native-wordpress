version: "3.8"

services:
  wp:
    image: wordpress:php8.1
    container_name: wp
    volumes:
      # - ./wp-content/themes:/var/www/html/wp-content/themes
      - ./plugins/learn-dash-space-repetition:/var/www/html/wp-content/plugins/learn-dash-space-repetition
      - ./plugins/learndash-api-custom:/var/www/html/wp-content/plugins/learndash-api-custom
      - ./debug.log:/var/www/html/wp-content/debug.log
      # - .:/var/www/html
      - share-html:/var/www/html
      # Bind-mount local wp-config.php so the container uses the edited file in this repo
      - ./config/wp-config.php:/var/www/html/wp-config.php:ro
      # this config to install plugins over size limit
      - ./config/php.ini:/usr/local/etc/php/php.ini
    ports:
      - 5000:80
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: example
      WORDPRESS_DB_NAME: wordpress
    depends_on:
      - db
  db:
    image: mysql:8.3.0
    container_name: db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: wordpress
    volumes:
      # - ./config:/docker-entrypoint-initdb.d
      - ./mysql-logs:/var/log/mysql
      - db_data:/var/lib/mysql
    command: --general-log=1 --general-log-file=/var/log/mysql/general.log --log-output=FILE
    ports:
      - 3306:3306
volumes:
  share-html:
  db_data:
